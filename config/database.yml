# PostgreSQL with schema-based domain separation
# Each domain uses a different schema within the same database
#
default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("DATABASE_USER") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  api:
    <<: *default
    database: qonto_swarm_development
    schema_search_path: api
    migrations_paths: db/api_migrate
  card_claim:
    <<: *default
    database: qonto_swarm_development
    schema_search_path: card_claim
    migrations_paths: db/card_claim_migrate
  company_monitoring:
    <<: *default
    database: qonto_swarm_development
    schema_search_path: company_monitoring
    migrations_paths: db/company_monitoring_migrate
  biller:
    <<: *default
    database: qonto_swarm_development
    schema_search_path: biller
    migrations_paths: db/biller_migrate

test:
  api:
    <<: *default
    database: qonto_swarm_test
    schema_search_path: api
    migrations_paths: db/api_migrate
  card_claim:
    <<: *default
    database: qonto_swarm_test
    schema_search_path: card_claim
    migrations_paths: db/card_claim_migrate
  company_monitoring:
    <<: *default
    database: qonto_swarm_test
    schema_search_path: company_monitoring
    migrations_paths: db/company_monitoring_migrate
  biller:
    <<: *default
    database: qonto_swarm_test
    schema_search_path: biller
    migrations_paths: db/biller_migrate

production:
  api:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME") { "qonto_swarm_production" } %>
    schema_search_path: api
    migrations_paths: db/api_migrate
  card_claim:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME") { "qonto_swarm_production" } %>
    schema_search_path: card_claim
    migrations_paths: db/card_claim_migrate
  company_monitoring:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME") { "qonto_swarm_production" } %>
    schema_search_path: company_monitoring
    migrations_paths: db/company_monitoring_migrate
  biller:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME") { "qonto_swarm_production" } %>
    schema_search_path: biller
    migrations_paths: db/biller_migrate
