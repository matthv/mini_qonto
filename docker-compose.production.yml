# Production docker-compose configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.production.yml up -d

services:
  web:
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST is required}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_NAME: ${DATABASE_NAME:-qonto_swarm_production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?RAILS_MASTER_KEY is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      FOREST_ENV_SECRET: ${FOREST_ENV_SECRET:-}
      FOREST_AUTH_SECRET: ${FOREST_AUTH_SECRET:-}
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
